---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  {% if page.subtitle %}<p class="subtitle">{{ page.subtitle }}</p>{% endif %}
  <button class="print-btn" type="button" hidden>Save as PDF</button>
  {{ content }}
</article>
<script src="{{ '/assets/js/print.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
